# Every Android version is pinned here. The scripts read compileSdk, ndk, ktlint, emulatorBuild and systemImage from this file.
[versions]
agp = "9.4.1"
kotlin = "2.4.21"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
jna = "5.19.1"
junit = "4.13.2"
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"
# Compose 1.12 needs API 37. The SDK package for it is "platforms;android-37.0".
compileSdk = "37"
# Android 12, the first version with key agreement in Android Keystore (D32).
minSdk = "31"
# The NDK that the ubuntu-24.04 runner image already has.
ndk = "27.3.13750724"
ktlint = "1.8.0"
# The build number of the emulator in https://dl.google.com/android/repository/repository2-3.xml (emulator-linux_x64-<build>.zip).
# scripts/setup.sh checks the zip against a SHA-256 hash.
emulatorBuild = "16428233"
# The one system image the device tests boot. GitHub's x86_64 Linux runners run it with KVM.
systemImage = "system-images;android-35;google_apis;x86_64"

[libraries]
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
