<!doctype html>
<html lang="en">
  <head>
    <!-- First in <head>: a <meta> policy covers only what comes after it. GitHub Pages sets no headers. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; require-trusted-types-for 'script'; trusted-types angular angular#bundler"
    />
    <!-- Relative asset paths, so the same build works at / and under a sub-path such as /lyre/. -->
    <base href="./" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lyre</title>
  </head>
  <body>
    <lyre-root></lyre-root>
  </body>
</html>
