name: CI

# A push to any branch runs CI, so hand-made pull requests show its result. NexKit's
# branches are left out: NexKit runs the same scripts as its own checks, and its pushes and
# pull requests use the Actions token, which starts no workflow or waits for approval.
on:
  push:
    branches-ignore: ['nexkit/**']
  # NexKit starts CI on main after it merges, because its merge starts no push workflow.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # NexKit only restores these caches; this workflow saves them when it runs on main.
      # Each step must match its entry in .nexkit/config.json exactly: the paths and the key
      # files in the same order. It runs before setup, so the key files are hashed as committed.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: nexkit-${{ runner.os }}-gradle-${{ hashFiles('android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: nexkit-${{ runner.os }}-gradle-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: nexkit-${{ runner.os }}-cargo-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: nexkit-${{ runner.os }}-cargo-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: nexkit-${{ runner.os }}-npm-${{ hashFiles('web/package-lock.json', 'tests/e2e/package-lock.json') }}
          restore-keys: nexkit-${{ runner.os }}-npm-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: nexkit-${{ runner.os }}-playwright-${{ hashFiles('tests/e2e/package-lock.json') }}
          restore-keys: nexkit-${{ runner.os }}-playwright-
      # The emulator's system image, which setup installs into the runner's preinstalled SDK,
      # and the pinned emulator's zip, which setup keeps to check and reuse.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /usr/local/lib/android/sdk/system-images
            ~/.cache/lyre/emulator
          key: nexkit-${{ runner.os }}-android-system-images-${{ hashFiles('android/gradle/libs.versions.toml') }}
          restore-keys: nexkit-${{ runner.os }}-android-system-images-
      - name: Setup
        run: scripts/setup.sh
      - name: Build
        id: build
        run: scripts/build.sh
      # Every check runs once the build succeeds, so one run shows all results.
      - name: Lint
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: scripts/lint.sh
      - name: Unit tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: scripts/test.sh
      - name: End-to-end tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: scripts/e2e.sh
      # On main, the web client that passed every check is the one GitHub Pages serves.
      - name: Upload the web client for GitHub Pages
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  # A development build until M9 releases the web client (see docs/delivery.md).
  deploy-web:
    needs: checks
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
