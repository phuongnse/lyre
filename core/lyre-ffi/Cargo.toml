[package]
name = "lyre-ffi"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
lyre-core.workspace = true
uniffi.workspace = true

[features]
# Builds the uniffi-bindgen tool. The Android build of the library leaves it out.
cli = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
required-features = ["cli"]
