[package]
name = "lyre-ffi"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
lyre-core.workspace = true
uniffi.workspace = true

[features]
# Builds the uniffi-bindgen tool with the host build of the core, so its dependencies compile once.
# The Android build of the library leaves it out with --no-default-features.
default = ["cli"]
cli = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
required-features = ["cli"]
