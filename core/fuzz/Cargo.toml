test = false
doc = false
bench = false

[[bin]]
name = "song_file_read"
path = "fuzz_targets/song_file_read.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lyrics"
path = "fuzz_targets/lyrics.rs"
test = false
doc = false
bench = false

[[bin]]
name = "timing"
path = "fuzz_targets/timing.rs"
test = false
doc = false
bench = false

[[bin]]
