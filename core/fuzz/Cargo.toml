[package]
name = "lyre-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# Its own workspace, so the core workspace and its checks ignore it.
[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
lyre-core = { path = "../lyre-core" }

[[bin]]
name = "song_file_header"
path = "fuzz_targets/song_file_header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "song_file_index"
path = "fuzz_targets/song_file_index.rs"
test = false
doc = false
bench = false

[[bin]]
