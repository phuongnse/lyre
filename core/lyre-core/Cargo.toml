[package]
name = "lyre-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT AND CC-BY-SA-4.0"

[dependencies]
sha2 = { version = "0.10", default-features = false }
p256 = { version = "0.13", default-features = false, features = ["arithmetic"] }
hkdf = "0.12"
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
hpke = { version = "0.12", default-features = false, features = ["p256", "alloc"] }
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
serde_json = "1"
unicode-normalization = "0.1"
qrcodegen = "1"

# The browser has no operating system, so the random bytes come from crypto.getRandomValues.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
rqrr = { version = "0.11", default-features = false }
toml = "1"

[features]
default = ["wiktionary-words"]
# Leaves out the Wiktionary word list. Only scripts/build.sh uses it, to measure the list's size (D18).
wiktionary-words = []

[[example]]
name = "word_list_size"
crate-type = ["cdylib"]
